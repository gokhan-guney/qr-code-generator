<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR Kod Oluşturucu</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#14171c;--muted:#5d6672;--line:#dde1e6;--accent:#3b5bfd;--accent-t:#fff;--input:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#181b21;--text:#eceff3;--muted:#98a1ad;--line:#2b3039;--accent:#7b93ff;--accent-t:#0b0f1a;--input:#10131a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#181b21;--text:#eceff3;--muted:#98a1ad;--line:#2b3039;--accent:#7b93ff;--accent-t:#0b0f1a;--input:#10131a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:880px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:700px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{flex:1;padding:9px;border:1px solid var(--line);background:var(--input);color:var(--text);border-radius:9px;cursor:pointer;font:inherit}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=password],textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--input);color:var(--text);font:inherit}
textarea{min-height:96px;resize:vertical}
.row{display:flex;gap:12px}
.row>div{flex:1}
input[type=color]{width:100%;height:40px;border:1px solid var(--line);border-radius:9px;background:var(--input);padding:3px}
input[type=range]{width:100%}
.out{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;text-align:center}
.out img{max-width:100%;height:auto;border-radius:8px;border:1px solid var(--line)}
.hint{color:var(--muted);font-size:.85rem;margin-top:12px}
.err{color:#d6336c}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>QR Kod Oluşturucu</h1>
<p class="sub">Metin, bağlantı veya Wi-Fi bilgisini anında QR koda çevirin.</p>
<div class="grid">
<section class="card">
<div class="tabs" role="tablist">
<button class="tab" role="tab" aria-selected="true" data-t="text">Metin / Bağlantı</button>
<button class="tab" role="tab" aria-selected="false" data-t="wifi">Wi-Fi</button>
</div>
<div id="p-text">
<label for="txt">İçerik</label>
<textarea id="txt" placeholder="https://ornek.com"></textarea>
</div>
<div id="p-wifi" class="hide">
<label for="ssid">Ağ adı (SSID)</label>
<input type="text" id="ssid">
<label for="pw">Şifre</label>
<input type="password" id="pw">
<label for="enc">Güvenlik</label>
<select id="enc"><option value="WPA">WPA/WPA2</option><option value="WEP">WEP</option><option value="nopass">Şifresiz</option></select>
</div>
<div class="row">
<div><label for="fg">QR rengi</label><input type="color" id="fg" value="#000000"></div>
<div><label for="bg">Arka plan</label><input type="color" id="bg" value="#ffffff"></div>
</div>
<div class="row">
<div><label for="ec">Hata düzeltme</label>
<select id="ec"><option value="L">Düşük (L)</option><option value="M" selected>Orta (M)</option><option value="Q">Yüksek (Q)</option><option value="H">En yüksek (H)</option></select></div>
<div><label for="mg">Kenar boşluğu: <span id="mgv">4</span></label><input type="range" id="mg" min="0" max="10" value="4"></div>
</div>
<label for="sz">Boyut: <span id="szv">320</span> px</label>
<input type="range" id="sz" min="160" max="640" step="20" value="320">
</section>
<section class="card out">
<div id="ph" class="hint">QR kodunuz burada görünecek.</div>
<img id="img" class="hide" alt="Oluşturulan QR kod">
<div id="msg" class="hint hide"></div>
</section>
</div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var mode='text';
try{if(qrcode.stringToBytesFuncs&&qrcode.stringToBytesFuncs['UTF-8']){qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8'];}}catch(e){}
function esc(s){return s.replace(/([\\;,:"])/g,'\\$1');}
function getData(){
if(mode==='wifi'){
var s=$('ssid').value;if(!s)return '';
var t=$('enc').value;
return 'WIFI:T:'+t+';S:'+esc(s)+';'+(t==='nopass'?'':'P:'+esc($('pw').value)+';')+';';
}
return $('txt').value;
}
function render(){
var data=getData(),img=$('img'),ph=$('ph'),msg=$('msg');
$('mgv').textContent=$('mg').value;$('szv').textContent=$('sz').value;
msg.className='hint hide';
if(!data){img.className='hide';ph.className='hint';return;}
try{
var qr=qrcode(0,$('ec').value);
qr.addData(data);qr.make();
var n=qr.getModuleCount(),m=+$('mg').value,total=n+2*m;
var cell=Math.max(1,Math.floor(+$('sz').value/total));
var c=document.createElement('canvas');c.width=c.height=cell*total;
var x=c.getContext('2d');
x.fillStyle=$('bg').value;x.fillRect(0,0,c.width,c.height);
x.fillStyle=$('fg').value;
for(var r=0;r<n;r++)for(var k=0;k<n;k++)if(qr.isDark(r,k))x.fillRect((k+m)*cell,(r+m)*cell,cell,cell);
img.src=c.toDataURL('image/png');
img.width=c.width/(window.devicePixelRatio>1?1:1);
img.className='';ph.className='hide';
msg.textContent='Kaydetmek için görsele sağ tıklayın veya uzun basın.';
msg.className='hint';
}catch(e){
img.className='hide';ph.className='hide';
msg.textContent='İçerik çok uzun, QR koda sığmıyor. Lütfen kısaltın.';
msg.className='hint err';
}
}
document.querySelectorAll('.tab').forEach(function(b){
b.addEventListener('click',function(){
mode=b.getAttribute('data-t');
document.querySelectorAll('.tab').forEach(function(o){o.setAttribute('aria-selected',o===b?'true':'false');});
$('p-text').className=mode==='text'?'':'hide';
$('p-wifi').className=mode==='wifi'?'':'hide';
render();
});
});
['txt','ssid','pw','enc','fg','bg','ec','mg','sz'].forEach(function(i){
$(i).addEventListener('input',render);
$(i).addEventListener('change',render);
});
render();
})();
</script>
</body>
</html>
